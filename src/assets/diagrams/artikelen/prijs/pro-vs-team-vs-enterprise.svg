<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Staafdiagram van de totale maandkosten: bij 3, 5 en 10 gebruikers kost Claude Team 75, 125 en 250 dollar tegen 60, 100 en 200 dollar voor losse Pro-accounts; het verschil bij 5 gebruikers is 25 dollar" font-family="Inter, system-ui, sans-serif" fill="#23261D"><defs>
