</defs><rect width="1200" height="600" fill="#F4F1E8"/><rect x="64" y="48" width="64" height="4" rx="2" fill="#B4C13E"/><text x="64" y="92" fill="#565A4C" font-size="22" font-weight="600" letter-spacing="3">CLAUDE PRO OF TEAM · TOTAAL PER MAAND · USD · BIJ MAANDBETALING</text><rect x="330" y="118" width="20" height="20" rx="4" fill="#CFCDBE"/><text x="358" y="136" font-size="26" fill="#565A4C">losse Pro-accounts</text><rect x="620" y="118" width="20" height="20" rx="4" fill="#3D5220"/><text x="648" y="136" font-size="26" fill="#565A4C">meerprijs Team</text><text x="64" y="214" font-size="34" font-weight="600">3 gebruikers</text><text x="64" y="250" font-size="26" fill="#565A4C">losse Pro: $60</text><rect x="330" y="180" width="168" height="64" rx="10" fill="#CFCDBE"/><rect x="498" y="180" width="42" height="64" rx="10" fill="#3D5220"/><text letter-spacing="-1" x="558" y="227" font-family="'Instrument Sans Variable', Inter, system-ui, sans-serif" font-weight="600" font-size="44" fill="#23261D">$75</text><text x="64" y="324" font-size="34" font-weight="600">5 gebruikers</text><text x="64" y="360" font-size="26" fill="#565A4C">losse Pro: $100</text><rect x="330" y="290" width="280" height="64" rx="10" fill="#CFCDBE"/><rect x="610" y="290" width="70" height="64" rx="10" fill="#3D5220"/><text letter-spacing="-1" x="698" y="337" font-family="'Instrument Sans Variable', Inter, system-ui, sans-serif" font-weight="600" font-size="44" fill="#23261D">$125</text><text x="822" y="337" font-size="32" font-weight="600" fill="#565A4C">verschil: $25</text><text x="64" y="434" font-size="34" font-weight="600">10 gebruikers</text><text x="64" y="470" font-size="26" fill="#565A4C">losse Pro: $200</text><rect x="330" y="400" width="560" height="64" rx="10" fill="#CFCDBE"/><rect x="890" y="400" width="140" height="64" rx="10" fill="#3D5220"/><text letter-spacing="-1" x="1048" y="447" font-family="'Instrument Sans Variable', Inter, system-ui, sans-serif" font-weight="600" font-size="44" fill="#23261D">$250</text><line x1="330" y1="160" x2="330" y2="484" stroke="#23261D" stroke-width="3"/><text x="64" y="530" font-size="26" fill="#565A4C">de meerprijs koopt beheer, gedeelde kennis, SSO en de zakelijke voorwaarden</text><text x="1136" y="566" text-anchor="end" font-size="26" fill="#64685A">stand 22 okt 2026 · bars op schaal</text><rect width="1200" height="600" filter="url(#pte-g)"/></svg>
