<text x="92" y="166" font-size="32" font-weight="600">Windows-versie</text>
<text x="92" y="202" font-size="26" fill="#565A4C">vanaf build 19041</text>
<text x="504" y="166" text-anchor="middle" font-size="32" font-weight="600">herstarten</text>
<text x="504" y="202" text-anchor="middle" font-size="26" fill="#565A4C">opnieuw opstarten</text>
<text x="888" y="166" text-anchor="middle" font-size="32" font-weight="600">beleid</text>
<text x="888" y="202" text-anchor="middle" font-size="26" fill="#565A4C">register of Intune</text>
<text x="312" y="322" text-anchor="middle" font-size="32" font-weight="600">VM-onderdeel aan</text>
<text x="312" y="358" text-anchor="middle" font-size="26" fill="#565A4C">Virtual Machine Platform</text>
<text x="696" y="322" text-anchor="middle" font-size="32" font-weight="600">installeren</text>
<text x="696" y="358" text-anchor="middle" font-size="26" fill="#565A4C">als beheerder of per machine</text>
<text x="1136" y="322" text-anchor="end" font-size="32" font-weight="600" fill="#3D5220">testen</text>
<text x="1136" y="358" text-anchor="end" font-size="26" fill="#565A4C">eerst één pc</text>
<text x="696" y="414" text-anchor="middle" font-size="26" font-weight="600" fill="#A8433B">zonder beheerdersrechten geen Cowork</text>
