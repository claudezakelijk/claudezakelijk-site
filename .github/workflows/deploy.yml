name: Deploy site to Cloudflare Pages

# Builds the Implementeren.ai site and deploys it to Cloudflare Pages with wrangler.
# Runs on every push to main, once a day on a schedule, and can be triggered manually.
#
# The daily run (05:15 UTC = 06:15 CET / 07:15 CEST) makes scheduled articles go live
# without a push: an entry with status published and a publishDate in the future is left
# out of the build until that date (src/lib/publicatie.mjs, decision Max 22 Oct 2026).
# GitHub runs schedules on the default branch (main) and can start them some minutes late.
# Keep the schedule as long as articles carry a future publishDate; without this run they
# would wait for the next unrelated push to main.
#
# THIS IS THE ONLY PRODUCTION DEPLOY PATH (since 2026-07-21).
# The Pages project is still connected to this GitHub repo, but Cloudflare's own
# automatic production builds are switched OFF
# (source.config.production_deployments_enabled = false). Previously both ran on
# every push and raced each other for production. Branch/PR previews are still
# built by Cloudflare and are unaffected.
# To hand production back to Cloudflare, flip that flag true and delete this file.
#
# The deploy job runs in the GitHub environment "production" (Settings -> Environments).
# That environment only allows the main branch, so a run from any other branch or a PR
# never gets the secrets below. All four secrets live in that environment, not in the repo.
# Required environment secrets:
#   CLOUDFLARE_API_TOKEN  - a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account id
# Optional repository variable:
#   CLOUDFLARE_PROJECT_NAME - the Pages project name (defaults to "implementeren-ai-site").
#     Must match the EXISTING project that serves implementeren.ai.
# Optional environment secrets (A-11). Without them the purge step skips itself with a notice:
#   CLOUDFLARE_ZONE_ID     - zone implementeren.ai > Overview > API > Zone ID
#   CLOUDFLARE_PURGE_TOKEN - API token with only Zone > Cache Purge > Purge,
#     zones claudezakelijk.nl + implementeren.ai (the old domain only 301-redirects)
# IndexNow needs no secret: the key is the public file public/<32 hex>.txt (A-22).

on:
  push:
    branches: [main]
  # Ingeplande artikelen gaan live bij de eerste geplande run op hun publishDate. GitHub start
  # geplande runs soms uren te laat of slaat er een over; de tweede run is het vangnet. Een
  # dubbele deploy is onschuldig (zelfde build, concurrency hieronder), IndexNow ook.
  schedule:
    - cron: '15 5 * * *'
    - cron: '45 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Volledige geschiedenis: indexnow.mjs --since vergelijkt met de commit van voor de push.
      # persist-credentials: false (S2-05): geen job-stap pusht, dus het GITHUB_TOKEN hoeft
      # niet in .git/config te staan terwijl npm ci en de build draaien.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Quality gate: checkt alle published content incl. link-targets. Faalt de
      # gate, dan wordt er niet gedeployed.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install gate dependencies
        run: pip install pyyaml
      - name: Quality gate (published content + link targets)
        run: python scripts/quality-gate.py --all

      - run: npm run build

      # Dode interne links op de zakelijke site houden de deploy tegen.
      - name: Linkcheck dist (zakelijke site)
        run: node scripts/linkcheck.mjs

      # On-page-check (Spec C). Nog niet blokkerend: staat op 2 fouten tot C-23 slaagt.
      # Na C-23: de regel continue-on-error weghalen, dan houdt een fout de deploy tegen (H9).
      - name: On-page check (niet blokkerend tot C-23)
        continue-on-error: true
        run: node scripts/onpage-check.mjs

      # Deploy met de wrangler uit package-lock.json (devDependency, npm ci hierboven), zonder
      # third-party action die het Cloudflare-token in handen krijgt (S2-03/S2-05).
      # --no-install: faalt in plaats van een zwevende wrangler te downloaden.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'implementeren-ai-site' }}
        run: >-
          npx --no-install wrangler pages deploy dist
          --project-name="$CF_PAGES_PROJECT"
          --branch=main

      # Zone-cache legen: oude kopieën (oude headers, verwijderde bestanden) mogen een deploy
      # niet overleven. Zonder de twee secrets (A-11) slaat deze stap zichzelf over.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_PURGE_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_ZONE_ID of CLOUDFLARE_PURGE_TOKEN ontbreekt; cache niet geleegd (A-11)."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq -e '.success == true' >/dev/null

      - name: Let the deploy settle
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: sleep 30

      # Na de deploy staat de site al live: dit is het alarm, geen poort. Nog niet blokkerend,
      # want verify-live meldt nu 6 bekende fouten (de crawlerregels, tot A-08). Geeft het
      # script "all checks passed": continue-on-error weghalen.
      - name: Verify live site (niet blokkerend tot de bekende fouten weg zijn)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/verify-live.mjs

      # IndexNow: meld de zakelijke URL's die deze push veranderde. Nooit blokkerend: een
      # overgeslagen ping kost niets. Lege of nul-sha (eerste push, force-push): exit 0.
      - name: IndexNow (changed business URLs)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && github.event_name == 'push' }}
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/indexnow.mjs --since "$BEFORE_SHA"

      # IndexNow voor ingeplande artikelen: de geplande run heeft geen before-sha, dus de
      # stap hierboven ziet niets. Deze meldt de entries met publishDate vandaag plus hun hub.
      # Ook bij een handmatige run, voor het geval de geplande run die dag mislukte.
      # Nooit blokkerend, net als hierboven.
      - name: IndexNow (articles published today)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        run: node scripts/indexnow.mjs --published-on
